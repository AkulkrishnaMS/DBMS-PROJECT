services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: judge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports: ["5433:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro   # runs 01_*.sql, 02_*.sql on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: judge_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro      # runs init.js on first boot

  # ---- Judge0 (code execution sandbox). Start with: docker compose --profile judge up -d ----
  judge0-db:
    image: postgres:16
    profiles: ["judge"]
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
    volumes: [judge0_db:/var/lib/postgresql/data]

  judge0-redis:
    image: redis:7
    profiles: ["judge"]
    command: ["redis-server", "--requirepass", "${JUDGE0_REDIS_PASSWORD}"]

  judge0-server:
    image: judge0/judge0:1.13.1
    profiles: ["judge"]
    privileged: true            # needed by Judge0's isolate sandbox
    ports: ["2358:2358"]
    depends_on: [judge0-db, judge0-redis]
    environment: &judge0env
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
      SECRET_KEY_BASE: ${JUDGE0_SECRET_KEY_BASE}

  judge0-workers:
    image: judge0/judge0:1.13.1
    profiles: ["judge"]
    privileged: true
    command: ["./scripts/workers"]
    depends_on: [judge0-db, judge0-redis]
    environment: *judge0env

volumes:
  pg_data:
  mongo_data:
  judge0_db:
